<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendar | Emerald City Rounds</title>
    <link rel="stylesheet" href="_css/calendar.css">
  </head>
  <body>
    <main class="calendar-page">
      <h1>Calendar</h1>

      <section class="calendar-controls">
        <button id="prevMonth" aria-label="Previous month">◀</button>
        <h2 id="monthLabel">Month</h2>
        <button id="nextMonth" aria-label="Next month">▶</button>
      </section>

      <section id="calendar" class="calendar"></section>

      <div id="eventModal" class="modal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true">
          <button id="closeModal" class="modal-close" aria-label="Close">✕</button>
          <div id="modalBody"></div>
        </div>
      </div>
    </main>

    <script src="_js/calendar.js" defer></script>
  </body>
</html>
